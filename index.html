<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Kai Grade NEXT V1.5</title>
<style>
:root{--bg:#f2f4fa;--p:#fff;--p2:#f7f8fc;--t:#172033;--m:#778197;--l:#e4e8f0;--a:#6558e8;--good:#159b75;--bad:#d65c68;--shadow:0 10px 30px #1720440c}
[data-theme=dark]{--bg:#0c1220;--p:#151e30;--p2:#1b263a;--t:#edf1fb;--m:#9aa7bf;--l:#2b3850;--a:#a196ff;--good:#4ac5a0;--bad:#ff7e89;--shadow:0 10px 30px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--a),#31b6b0);display:grid;place-items:center;color:white;font-weight:900;font-size:21px}h1{font-size:20px;margin:0}.muted{color:var(--m);font-size:12px}.btn{border:1px solid var(--l);background:var(--p);color:var(--t);padding:9px 12px;border-radius:11px;font-weight:650}.primary{background:var(--a);color:white;border-color:var(--a)}.danger{color:var(--bad)}.actions,.tools{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:205px 1fr;gap:16px}.side,.panel,.stat{background:var(--p);border:1px solid var(--l);border-radius:17px;box-shadow:var(--shadow)}.side{padding:10px;height:max-content;position:sticky;top:12px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:none;text-align:left;color:var(--m);padding:10px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:var(--p2);color:var(--a)}.nav small{color:var(--m);padding:12px 9px 4px}.content{min-width:0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:3px 0 15px}.head h2{font-size:23px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{padding:15px}.stat .value{font-size:26px;font-weight:800}.stat .label,.hint{font-size:12px;color:var(--m)}.panel{padding:16px;margin-top:13px}.panel h3{font-size:16px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:13px}.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;background:var(--p2);border:1px solid var(--l);border-radius:11px}.item strong{display:block}.empty{text-align:center;padding:24px;background:var(--p2);border-radius:11px;color:var(--m)}.pill{font-size:11px;border-radius:20px;background:#6558e81a;color:var(--a);padding:3px 8px}.search,.field input,.field select,.field textarea{width:100%;border:1px solid var(--l);border-radius:10px;padding:10px;background:var(--p2);color:var(--t)}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--m);font-weight:700}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:550px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--l);font-size:13px}th{color:var(--m);font-size:11px}.mini{padding:5px 8px;font-size:11px;margin-left:4px}.bar{height:8px;background:var(--l);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--a),#31b6b0)}.subject{display:grid;grid-template-columns:70px 1fr 40px;gap:9px;align-items:center;margin:12px 0;font-size:12px}.modalback{position:fixed;inset:0;background:#070d1ab0;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modalback.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--p);padding:10px 15px;border-radius:11px;display:none;z-index:20}.toast.show{display:block}.foot{text-align:center;color:var(--m);font-size:11px;padding:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;overflow:auto}.nav{flex-direction:row;min-width:max-content}.nav small{display:none}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.shell{padding:12px}}
@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.formgrid{grid-template-columns:1fr}.panel{padding:12px}.head h2{font-size:20px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="logo">K</div><div><h1>Kai Grade <span class="pill">NEXT V1.5</span></h1><div class="muted">讓每一筆成績，都成為進步的依據。</div></div></div><div class="actions"><button class="btn" id="theme">◐ 外觀</button><button class="btn" id="backup">資料備份</button><button class="btn primary" id="quick">＋ 快速新增</button></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav"><small>工作空間</small><button class="active" data-page="home">⌂　總覽</button><button data-page="grades">▤　成績管理</button><button data-page="exams">▣　考試中心</button><button data-page="mistakes">✎　錯題練習庫</button><button data-page="tasks">✓　學習任務</button><button data-page="notes">▧　筆記中心</button><small>分析與系統</small><button data-page="analysis">◫　學習分析</button><button data-page="semester">▦　學期報告</button><button data-page="data">⚙　資料中心</button></nav></aside><main class="content" id="view"></main></div><div class="foot">Kai Grade NEXT V1.5 · 本機優先 · IndexedDB</div></div>
<div class="modalback" id="backdrop"><div class="modal"><div class="modalhead"><b id="mtitle">新增</b><button class="btn" id="close">✕</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],subjects=['國文','英文','數學','自然','地理','歷史','公民','其他'];let db,S={page:'home',d:{grades:[],exams:[],mistakes:[],tasks:[],notes:[],meta:{theme:'light'}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),avg=a=>a.length?a.reduce((n,x)=>n+ +x.score,0)/a.length:0,fmt=n=>Number(n||0).toFixed(1).replace(/\.0$/,'');
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('KaiGradeNEXT15',1);r.onupgradeneeded=()=>r.result.createObjectStore('app');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function load(){return new Promise((ok,no)=>{let r=db.transaction('app').objectStore('app').get('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function save(){return new Promise((ok,no)=>{let t=db.transaction('app','readwrite');t.objectStore('app').put(S.d,'data');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function persist(){try{await save()}catch(e){toast('儲存失敗，請先備份')}}
const head=(t,d,a='')=>`<div class="head"><div><h2>${t}</h2><div class="muted">${d}</div></div>${a}</div>`,empty=t=>`<div class="empty">${t}</div>`,act=(t,a,c='btn')=>`<button class="${c}" data-act="${a}">${t}</button>`;
function render(){ $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));let f={home,grades,exams,mistakes,tasks,notes,analysis,semester,data};$('#view').innerHTML=f[S.page]();bind()}
function home(){let g=S.d.grades,e=S.d.exams.filter(x=>x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date))[0];return head('學習總覽','掌握目前進度，讓下一步更清楚。',act('＋ 新增成績','addGrade','btn primary'))+`<div class="grid"><div class="stat"><div class="label">成績筆數</div><div class="value">${g.length}</div></div><div class="stat"><div class="label">目前平均</div><div class="value">${fmt(avg(g))||'—'}</div></div><div class="stat"><div class="label">待完成任務</div><div class="value">${S.d.tasks.filter(x=>!x.done).length}</div></div><div class="stat"><div class="label">錯題收藏</div><div class="value">${S.d.mistakes.length}</div></div></div><div class="two"><section class="panel"><h3>最近成績</h3><div class="list">${g.slice().sort((a,b)=>b.created-a.created).slice(0,5).map(x=>`<div class="item"><div><strong>${esc(x.subject)} · ${esc(x.exam)}</strong><div class="muted">${esc(x.date)}</div></div><b>${fmt(x.score)}${x.full?' / '+fmt(x.full):''}</b></div>`).join('')||empty('尚無成績紀錄')}</div></section><section class="panel"><h3>近期考試</h3>${e?`<div class="item"><div><strong>${esc(e.name)}</strong><div class="muted">${esc(e.date)} · ${esc(e.subject)}</div></div><span class="pill">即將到來</span></div>`:empty('目前沒有未來考試')}<h3 style="margin-top:16px">快捷入口</h3><div class="tools">${act('新增考試','addExam')}${act('新增任務','addTask')}${act('記錄錯題','addMistake')}</div></section></div>`}
function grades(){let a=S.d.grades.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));return head('成績管理','記錄、修改與追蹤每一次考試。',act('＋ 新增成績','addGrade','btn primary'))+`<section class="panel"><input id="search" class="search" placeholder="搜尋科目或考試名稱…"><div class="tablewrap"><table><thead><tr><th>日期</th><th>科目</th><th>考試</th><th>得分</th><th>操作</th></tr></thead><tbody id="rows">${a.map(x=>`<tr data-q="${esc((x.subject+' '+x.exam).toLowerCase())}"><td>${esc(x.date)}</td><td>${esc(x.subject)}</td><td>${esc(x.exam)}</td><td><b>${fmt(x.score)}</b>${x.full?' / '+fmt(x.full):''}</td><td>${act('編輯','editGrade:'+x.id,'btn mini')}${act('刪除','delGrade:'+x.id,'btn mini danger')}</td></tr>`).join('')}</tbody></table></div>${a.length?'':empty('尚無成績紀錄')}</section>`}
function exams(){return head('考試中心','管理考試日期與考試清單。',act('＋ 新增考試','addExam','btn primary'))+`<section class="panel"><div class="list">${S.d.exams.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.date)} · ${esc(x.subject)} ${x.archived?'<span class="pill">已封存</span>':''}</div></div><div>${act('編輯','editExam:'+x.id,'btn mini')}${act(x.archived?'取消封存':'封存','archive:'+x.id,'btn mini')}${act('刪除','delExam:'+x.id,'btn mini danger')}</div></div>`).join('')||empty('尚無考試')}</div></section>`}
function mistakes(){return head('錯題練習庫','將錯過的題目整理成複習素材。',act('＋ 記錄錯題','addMistake','btn primary'))+`<section class="panel"><div class="list">${S.d.mistakes.map(x=>`<div class="item"><div><strong>${esc(x.subject)} · ${esc(x.title)}</strong><div class="muted">${esc(x.reason)}</div><div class="muted">${esc(x.answer)}</div></div><div>${act('編輯','editMistake:'+x.id,'btn mini')}${act('刪除','delMistake:'+x.id,'btn mini danger')}</div></div>`).join('')||empty('錯題庫目前是空的')}</div></section>`}
function tasks(){return head('學習任務','安排下一步，完成後勾選即可。',act('＋ 新增任務','addTask','btn primary'))+`<section class="panel"><div class="list">${S.d.tasks.map(x=>`<div class="item"><div><label><input type="checkbox" data-task="${x.id}" ${x.done?'checked':''}> <b>${esc(x.title)}</b></label><div class="muted">${esc(x.date)} · ${esc(x.subject)}</div></div>${act('刪除','delTask:'+x.id,'btn mini danger')}</div>`).join('')||empty('尚無學習任務')}</div></section>`}
function notes(){return head('筆記中心','保存複習重點與個人整理。',act('＋ 新增筆記','addNote','btn primary'))+`<section class="panel"><div class="list">${S.d.notes.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.subject)}</div>${esc(x.body).slice(0,140)}</div><div>${act('編輯','editNote:'+x.id,'btn mini')}${act('刪除','delNote:'+x.id,'btn mini danger')}</div></div>`).join('')||empty('還沒有筆記')}</div></section>`}
function analysis(){let g=S.d.grades,ss=subjects.filter(s=>g.some(x=>x.subject===s));return head('學習分析','以目前輸入的資料提供統計參考。')+`<div class="grid"><div class="stat"><div class="label">整體平均</div><div class="value">${fmt(avg(g))||'—'}</div></div><div class="stat"><div class="label">最高成績</div><div class="value">${g.length?fmt(Math.max(...g.map(x=>+x.score))):'—'}</div></div><div class="stat"><div class="label">最低成績</div><div class="value">${g.length?fmt(Math.min(...g.map(x=>+x.score))):'—'}</div></div><div class="stat"><div class="label">追蹤科目</div><div class="value">${ss.length}</div></div></div><section class="panel"><h3>各科平均</h3>${ss.map(s=>{let n=avg(g.filter(x=>x.subject===s));return `<div class="subject"><b>${s}</b><div class="bar"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div><b>${fmt(n)}</b></div>`}).join('')||empty('新增成績後顯示分析')}<p class="muted">這裡是本機規則統計，不是生成式 AI；樣本少時僅供參考。</p></section>`}
function semester(){let keys=[...new Set(S.d.grades.map(x=>x.term||'未分類學期'))];return head('學期報告','依學期彙整成績，並可列印或另存 PDF。',act('列印報告','print','btn primary'))+`<section class="panel"><div class="list">${keys.map(k=>{let a=S.d.grades.filter(x=>(x.term||'未分類學期')===k);return `<div class="item"><div><b>${esc(k)}</b><div class="muted">${a.length} 筆 · ${[...new Set(a.map(x=>x.subject))].join('、')}</div></div><b>平均 ${fmt(avg(a))}</b></div>`}).join('')||empty('尚無學期成績')}</div></section>`}
function data(){return head('資料中心','備份、還原與本機資料管理。')+`<div class="two"><section class="panel"><h3>資料備份</h3><p class="muted">建議定期下載 JSON 備份，並妥善保存。</p><div class="tools">${act('下載 JSON 備份','export','btn primary')}<label class="btn">匯入 JSON<input id="import" type="file" accept=".json,application/json" hidden></label>${act('匯出成績 CSV','csv')}</div></section><section class="panel"><h3>本機資料狀態</h3><div class="item">儲存方式 <b>IndexedDB</b></div><div class="item">成績 <b>${S.d.grades.length} 筆</b></div><div class="item">考試 <b>${S.d.exams.length} 筆</b></div><div class="item">筆記／錯題 <b>${S.d.notes.length+S.d.mistakes.length} 筆</b></div><p class="muted">資料保存在目前瀏覽器與裝置。清除瀏覽器資料前請先備份。</p>${act('清除全部資料','clear','btn danger')}</section></div>`}
function field(l,n,v='',type='text',extra=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v)}" ${extra}></div>`}function select(l,n,v,opts){return `<div class="field"><label>${l}</label><select name="${n}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function form(title,body,fn){$('#mtitle').textContent=title;$('#mbody').innerHTML=`<form id="form">${body}</form><div class="tools" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">儲存</button></div>`;$('#backdrop').classList.add('show');$('#close').onclick=close;$('#cancel').onclick=close;$('#save').onclick=()=>fn(Object.fromEntries(new FormData($('#form'))))}
function close(){$('#backdrop').classList.remove('show')}
function edit(type,id){let key={Grade:'grades',Exam:'exams',Mistake:'mistakes',Task:'tasks',Note:'notes'}[type],x=S.d[key].find(a=>a.id===id)||{},f='';if(type==='Grade')f=`<div class="formgrid">${field('日期','date',x.date||new Date().toISOString().slice(0,10),'date')}${select('科目','subject',x.subject||'國文',subjects)}${field('考試名稱','exam',x.exam||'')}${field('得分','score',x.score??'','number','required min="0" step=".1"')}${field('滿分','full',x.full??100,'number','min="0"')}${field('學期','term',x.term||'')}</div>`;
if(type==='Exam')f=`${field('考試名稱','name',x.name||'')}${field('日期','date',x.date||'','date')}${select('科目','subject',x.subject||'全部科目',['全部科目',...subjects])}`;
if(type==='Mistake')f=`${select('科目','subject',x.subject||'數學',subjects)}${field('題目標題','title',x.title||'')}<div class="field"><label>錯誤原因</label><textarea name="reason">${esc(x.reason||'')}</textarea></div><div class="field"><label>正確觀念／解法</label><textarea name="answer">${esc(x.answer||'')}</textarea></div>`;
if(type==='Task')f=`${field('任務名稱','title',x.title||'')}${field('期限','date',x.date||'','date')}${select('科目','subject',x.subject||'一般',['一般',...subjects])}`;
if(type==='Note')f=`${field('標題','title',x.title||'')}${select('科目','subject',x.subject||'未分類',['未分類',...subjects])}<div class="field"><label>內容</label><textarea name="body">${esc(x.body||'')}</textarea></div>`;
form(id?'編輯資料':'新增'+({Grade:'成績',Exam:'考試',Mistake:'錯題',Task:'任務',Note:'筆記'}[type]),f,v=>{if(type==='Grade'){v.score=+v.score;v.full=+v.full||null;if(v.full&&v.score>v.full)return toast('得分不可超過滿分')}if(type==='Exam'&&!v.name.trim())return toast('請輸入考試名稱');if(type==='Task'&&!v.title.trim())return toast('請輸入任務名稱');if(type==='Note'&&!v.title.trim())return toast('請輸入筆記標題');let item={...x,...v,id:x.id||uid(),created:x.created||Date.now(),done:x.done||false};if(id)S.d[key]=S.d[key].map(a=>a.id===id?item:a);else S.d[key].push(item);close();persist();render();toast('已儲存')})}
function bind(){$$('[data-act]').forEach(b=>b.onclick=()=>run(b.dataset.act));$$('[data-task]').forEach(c=>c.onchange=()=>{let x=S.d.tasks.find(a=>a.id===c.dataset.task);x.done=c.checked;persist();render()});let q=$('#search');if(q)q.oninput=()=>$$('#rows tr').forEach(r=>r.hidden=!r.dataset.q.includes(q.value.toLowerCase()));let i=$('#import');if(i)i.onchange=importFile}
function run(a){let [cmd,id]=a.split(':');let adds={addGrade:'Grade',addExam:'Exam',addMistake:'Mistake',addTask:'Task',addNote:'Note'},edits={editGrade:'Grade',editExam:'Exam',editMistake:'Mistake',editTask:'Task',editNote:'Note'};if(adds[cmd])return edit(adds[cmd]);if(edits[cmd])return edit(edits[cmd],id);let del={delGrade:'grades',delExam:'exams',delMistake:'mistakes',delTask:'tasks',delNote:'notes'};if(del[cmd]){if(confirm('確定刪除此筆資料？')){S.d[del[cmd]]=S.d[del[cmd]].filter(x=>x.id!==id);done('已刪除')}return}if(cmd==='archive'){let x=S.d.exams.find(x=>x.id===id);x.archived=!x.archived;return done('狀態已更新')}if(cmd==='export')return backup();if(cmd==='csv')return csv();if(cmd==='print')return printReport();if(cmd==='clear'&&confirm('確定清除全部資料？此操作無法復原。')){S.d={grades:[],exams:[],mistakes:[],tasks:[],notes:[],meta:{theme:'light'}};done('資料已清除')}}
function done(t){persist();render();toast(t)}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('Kai-Grade-NEXT-backup.json',JSON.stringify({app:'Kai Grade NEXT',version:'1.5.0',data:S.d},null,2),'application/json');toast('備份已下載')}
async function importFile(e){let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.data||!Array.isArray(o.data.grades))throw 0;if(!confirm('匯入將取代目前資料，建議先備份。確定？'))return;S.d={...S.d,...o.data};await persist();render();toast('還原成功')}catch(_){toast('檔案格式錯誤，未匯入')}e.target.value=''}
function csv(){let rows=[['日期','科目','考試','得分','滿分','學期'],...S.d.grades.map(x=>[x.date,x.subject,x.exam,x.score,x.full,x.term])];download('Kai-Grade-grades.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function printReport(){let w=window.open('','_blank');if(!w)return toast('請允許彈出視窗');w.document.write('<meta charset="utf-8"><h1>Kai Grade NEXT 學期成績報告</h1><p>整體平均：'+fmt(avg(S.d.grades))+'</p><table border="1" cellpadding="8"><tr><th>日期</th><th>學期</th><th>科目</th><th>考試</th><th>得分</th></tr>'+S.d.grades.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.term)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.exam)+'</td><td>'+fmt(x.score)+'</td></tr>').join('')+'</table><script>window.print()<\/script>');w.document.close()}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){S.page=b.dataset.page;render()}};$('#theme').onclick=()=>{S.d.meta.theme=S.d.meta.theme==='dark'?'light':'dark';applyTheme();persist()};function applyTheme(){document.documentElement.dataset.theme=S.d.meta.theme||'light';$('#theme').textContent=S.d.meta.theme==='dark'?'☀ 淺色':'◐ 外觀'}
$('#backup').onclick=backup;$('#quick').onclick=()=>edit('Grade');
(async()=>{try{db=await openDB();let d=await load();if(d)S.d={...S.d,...d};applyTheme();render()}catch(e){$('#view').innerHTML='無法啟動 IndexedDB，請使用最新版瀏覽器。'}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
